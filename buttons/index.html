<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emily's Boatloads of Buttons</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <h1>Emily's Boatloads of Buttons</h1>

        <div class="button-grid">

            <a href="https://www.cartoonnetwork.com/" class="button cartoon-network" target="_blank">
                <span class="cn-black">C</span><span class="cn-white">N</span><span class="cn-name">CARTOON NETWORK</span></a>

            <a href="https://www.explodingkittens.com/" class="button exploding-kittens" target="_blank">
                <span class="explosion">💥</span><span class="kitten-text">EXPLODING<br>KITTENS</span></a>

            <a href="https://www.instagram.com/" class="button instagram" target="_blank">
                <span class="instagram-icon"><span class="instagram-lens"></span><span class="instagram-dot"></span></span><span>Instagram</span></a>

            <a href="https://www.missouribotanicalgarden.org/" class="button botanical-garden" target="_blank">
                <span class="leaf leaf-one"></span><span class="leaf leaf-two"></span><span class="garden-text">Missouri<br>Botanical Garden</span></a>

            <a href="https://www.moo.com/us/" class="button moo" target="_blank">
                <span class="moo-card card-three"></span><span class="moo-card card-two"></span><span class="moo-front"><strong>MOO</strong><small>MAKE IT YOURS</small></span></a>

        </div>
    </main>
</body>

</html>
